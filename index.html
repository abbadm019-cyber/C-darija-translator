<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoDarija Code - Explicateur Intelligent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .code-font { font-family: 'Consolas', 'Courier New', monospace; }
    .result { direction: rtl; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

  <div class="max-w-5xl mx-auto p-6">
    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold text-blue-700 mb-3">InfoDarija Code</h1>
      <p class="text-xl text-gray-600">Traducteur & Explicateur Intelligent de Code vers le Darija</p>
      <p class="text-sm text-gray-500 mt-2">Projet Personnel - UM6P 3ème Année Informatique</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
      <!-- Tabs -->
      <div class="flex border-b">
        <button onclick="setMode('python')" id="tab-python"
                class="flex-1 py-5 text-lg font-semibold border-b-4 border-blue-600 text-blue-600">🐍 Python</button>
        <button onclick="setMode('c')" id="tab-c"
                class="flex-1 py-5 text-lg font-semibold text-gray-500">C</button>
      </div>

      <div class="p-8">
        <textarea id="codeInput" rows="12" 
                  class="w-full p-6 border-2 border-gray-200 rounded-2xl code-font text-sm focus:border-blue-500 focus:outline-none"
                  placeholder="Collez votre code Python ou C ici..."></textarea>

        <div class="flex gap-4 mt-6">
          <button onclick="explainCode()" 
                  class="flex-1 bg-green-600 hover:bg-green-700 text-white py-5 rounded-2xl text-xl font-bold flex items-center justify-center gap-3">
            <i class="fas fa-language"></i>
            Expliquer en Darija
          </button>
          
          <button onclick="loadExample()" 
                  class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-8 rounded-2xl font-medium">
            Exemple
          </button>
        </div>

        <!-- Résultat -->
        <div id="result" class="hidden mt-10">
          <h3 class="font-semibold text-2xl mb-6 text-gray-800 flex items-center gap-3">
            <i class="fas fa-lightbulb text-yellow-500"></i>
            Explication détaillée en Darija
          </h3>
          <div id="explanation" class="space-y-8"></div>
        </div>
      </div>
    </div>

    <footer class="text-center text-gray-500 text-sm mt-12">
      Développé pour démontrer l'accès à la technologie en Darija • UM6P 2026
    </footer>
  </div>

  <script>
    let currentMode = 'python';

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('tab-python').classList.toggle('border-b-4', mode === 'python');
      document.getElementById('tab-python').classList.toggle('border-blue-600', mode === 'python');
      document.getElementById('tab-python').classList.toggle('text-blue-600', mode === 'python');
      document.getElementById('tab-c').classList.toggle('border-b-4', mode === 'c');
      document.getElementById('tab-c').classList.toggle('border-blue-600', mode === 'c');
      document.getElementById('tab-c').classList.toggle('text-blue-600', mode === 'c');
    }

    function explainCode() {
      const code = document.getElementById('codeInput').value.trim();
      const explanationDiv = document.getElementById('explanation');
      const resultDiv = document.getElementById('result');

      if (!code) {
        alert("Veuillez coller un code !");
        return;
      }

      let explanation = "";

      const lines = code.split('\n');

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed) return;

        let comment = "سطر من الكود.";

        if (trimmed.startsWith("def ")) {
          const name = trimmed.split('(')[0].replace("def ", "");
          comment = `هادي دالة باسم <strong>${name}</strong>. هي كتستقبل بارامترات بين القوسين.`;
        }
        else if (trimmed.includes("if ")) {
          comment = "<strong>شرط (if)</strong> : الكود كينفذ غير إلا كانت الشرط صحيحة.";
        }
        else if (trimmed.includes("else")) {
          comment = "<strong>إلا (else)</strong> : كينفذ إذا الشرط السابق كان خطأ.";
        }
        else if (trimmed.includes("for ") || trimmed.includes("while")) {
          comment = "<strong>حلقة تكرار (Loop)</strong> : كتعاود تنفيذ جزء من الكود عدة مرات.";
        }
        else if (trimmed.includes("return ")) {
          comment = "<strong>return</strong> : كترجع نتيجة من الدالة.";
        }
        else if (trimmed.includes("print(") || trimmed.includes("printf")) {
          comment = "كيطبع الناتج فالشاشة (Output).";
        }
        else if (trimmed.includes("factorielle") || trimmed.includes("recursive")) {
          comment = "<strong>ريكورسيون (Récursion)</strong> : الدالة كتنادي على راسها.";
        }
        else if (trimmed.startsWith("#include")) {
          comment = "جلب مكتبة خارجية.";
        }
        else if (trimmed.startsWith("{")) {
          comment = "بداية كتلة الكود.";
        }
        else if (trimmed.startsWith("}")) {
          comment = "نهاية كتلة الكود.";
        }

        explanation += `
          <div class="bg-white border border-gray-100 rounded-2xl p-5 hover:shadow-md transition">
            <div class="flex items-start gap-4">
              <span class="bg-blue-100 text-blue-700 font-mono w-8 h-8 flex items-center justify-center rounded-lg flex-shrink-0 mt-1">${index + 1}</span>
              <div class="flex-1">
                <pre class="code-font bg-gray-50 p-4 rounded-xl text-sm overflow-x-auto">${trimmed}</pre>
                <p class="result mt-4 text-gray-700 text-[17px] leading-relaxed">${comment}</p>
              </div>
            </div>
          </div>`;
      });

      explanationDiv.innerHTML = explanation;
      resultDiv.classList.remove('hidden');
    }

    function loadExample() {
      const example = `def factorielle(n):
    if n == 0:
        return 1
    return n * factorielle(n-1)

print(factorielle(5))`;
      
      document.getElementById('codeInput').value = example;
      explainCode();
    }

    // Charger un exemple au démarrage
    window.onload = () => {
      setMode('python');
    };
  </script>
</body>
</html>
